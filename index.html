<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>بنك إتقان المعرفي | مدارس إتقان التربية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --itqan-purple-dark: #090112;
      --itqan-purple-deep: #160426;
      --itqan-purple: #6a1b9a;
      --itqan-purple-bright: #a855f7;
      --itqan-gold: #f5b301;
      --itqan-gold-light: #fed766;
      --itqan-gold-glow: rgba(245, 179, 1, 0.45);
      --cyan: #00d2d3;
      --correct: #10b981;
      --wrong: #ef4444;
      --selected: #ea580c;
      --card-bg: rgba(26, 8, 46, 0.85);
      --card-border: rgba(245, 179, 1, 0.35);
      --text: #ffffff;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #300854 0%, var(--itqan-purple-dark) 70%, #030007 100%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* أضواء المسرح السينمائية */
    .spotlights {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .light-beam {
      position: absolute;
      top: -20%;
      width: 350px;
      height: 140%;
      background: radial-gradient(ellipse at center, rgba(168, 85, 247, 0.18) 0%, transparent 65%);
      transform-origin: top center;
      animation: lightMotion 12s ease-in-out infinite alternate;
    }
    .light-left { left: 5%; animation-delay: -3s; }
    .light-right { right: 5%; animation-duration: 15s; }

    @keyframes lightMotion {
      0% { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }

    /* -------------------------------------------------------------
       1. الشاشة الافتتاحية
       ------------------------------------------------------------- */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at center, #260642 0%, #07010f 85%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .intro-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 1.8rem 1.4rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(106, 27, 154, 0.4);
      backdrop-filter: blur(15px);
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 16px;
      border: 2px solid var(--itqan-gold);
      box-shadow: 0 0 20px var(--itqan-gold-glow);
      margin-bottom: 1rem;
      cursor: pointer;
    }

    .logo-badge img {
      max-height: 55px;
      width: auto;
      object-fit: contain;
    }

    .intro-title {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 900;
      color: var(--itqan-gold);
      text-shadow: 0 0 15px var(--itqan-gold-glow);
      margin-bottom: 0.2rem;
    }

    .intro-motto {
      font-size: 0.9rem;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--itqan-gold-light);
    }

    .input-box, .select-box {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.2px solid rgba(245, 179, 1, 0.3);
      background: rgba(10, 2, 20, 0.9);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .input-box:focus, .select-box:focus {
      border-color: var(--itqan-gold);
      box-shadow: 0 0 10px var(--itqan-gold-glow);
    }

    .select-box option {
      background: var(--itqan-purple-deep);
      color: #fff;
    }

    .btn-launch {
      width: 100%;
      background: linear-gradient(135deg, var(--itqan-gold) 0%, #d97706 100%);
      color: #0b0217;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px var(--itqan-gold-glow);
      transition: all 0.2s;
      margin-top: 0.4rem;
    }

    .btn-launch:active {
      transform: scale(0.98);
    }

    /* -------------------------------------------------------------
       2. شاشة المسابقة المباشرة
       ------------------------------------------------------------- */
    #game-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1.2rem;
      background: rgba(10, 2, 20, 0.95);
      border-bottom: 1.5px solid var(--itqan-gold);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      background: #ffffff;
      padding: 3px 6px;
      border-radius: 8px;
      border: 1px solid var(--itqan-gold);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo img {
      max-height: 28px;
      width: auto;
      object-fit: contain;
    }

    .player-status h3 {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--itqan-gold);
      line-height: 1.2;
    }

    .player-status span {
      font-size: 0.7rem;
      color: var(--cyan);
      font-weight: 600;
    }

    .lifeline-bar {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-tool {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--itqan-gold);
      color: var(--itqan-gold-light);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-tool:hover:not(:disabled) {
      background: var(--itqan-gold);
      color: #000;
      box-shadow: 0 0 10px var(--itqan-gold-glow);
    }

    .btn-tool:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: #64748b;
      color: #64748b;
      text-decoration: line-through;
    }

    /* الساحة والوسط */
    main {
      flex: 1;
      display: flex;
      padding: 1rem 1.5rem;
      gap: 1.2rem;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
      align-items: center;
      overflow-y: auto;
    }

    .arena-content {
      flex: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }

    .arena-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .badge-category {
      background: rgba(106, 27, 154, 0.5);
      border: 1px solid var(--itqan-purple-bright);
      color: #f3e8ff;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .timer-ring {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--itqan-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 900;
      background: #0f031b;
      color: var(--itqan-gold);
      box-shadow: 0 0 12px var(--itqan-gold-glow);
      transition: all 0.3s;
    }

    .timer-critical {
      border-color: var(--wrong) !important;
      color: var(--wrong) !important;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.9) !important;
      animation: heartPulse 0.8s infinite;
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .question-screen {
      background: linear-gradient(180deg, rgba(38, 11, 66, 0.85) 0%, rgba(17, 3, 31, 0.95) 100%);
      border: 1.5px solid var(--itqan-gold);
      border-radius: 16px;
      padding: 1.2rem 1rem;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      font-weight: 700;
      text-align: center;
      margin-bottom: 1rem;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-option {
      background: linear-gradient(90deg, rgba(37, 10, 64, 0.75) 0%, rgba(18, 3, 33, 0.88) 100%);
      border: 1.2px solid rgba(245, 179, 1, 0.25);
      border-radius: 12px;
      color: #fff;
      padding: 0.8rem 1rem;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      font-weight: 600;
      text-align: right;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
    }

    .btn-option .choice-sym {
      color: var(--itqan-gold);
      margin-left: 8px;
      font-weight: 900;
      font-size: 1.05rem;
    }

    .btn-option:hover:not(:disabled) {
      border-color: var(--itqan-gold);
      background: rgba(106, 27, 154, 0.45);
    }

    .btn-option.selected {
      background: var(--selected) !important;
      color: #fff !important;
      border-color: #ffedd5 !important;
      box-shadow: 0 0 16px rgba(234, 88, 12, 0.8);
      animation: pulseSelection 0.5s infinite alternate;
    }

    @keyframes pulseSelection {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }

    .btn-option.correct {
      background: var(--correct) !important;
      color: #fff !important;
      border-color: #6ee7b7 !important;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.9);
      animation: flashSuccess 0.4s ease-in-out 3;
    }

    @keyframes flashSuccess {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .btn-option.wrong {
      background: var(--wrong) !important;
      color: #fff !important;
      border-color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.9);
    }

    .btn-option:disabled {
      cursor: default;
    }

    /* سلم النقاط */
    .ladder-panel {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0.8rem;
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      backdrop-filter: blur(10px);
    }

    .ladder-step {
      display: flex;
      justify-content: space-between;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.25s;
    }

    .ladder-step.active {
      background: linear-gradient(90deg, rgba(106, 27, 154, 0.85), rgba(245, 179, 1, 0.35));
      border: 1px solid var(--itqan-gold);
      color: #fff;
      transform: scale(1.02);
      box-shadow: 0 0 10px var(--itqan-gold-glow);
    }

    .ladder-step.milestone {
      color: var(--itqan-gold);
    }

    .mobile-ladder-btn {
      display: none;
      width: 100%;
      background: rgba(245, 179, 1, 0.12);
      border: 1px solid var(--itqan-gold);
      color: var(--itqan-gold);
      padding: 8px;
      border-radius: 10px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .shake-screen {
      animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    /* النوافذ التفاعلية */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 1, 10, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 1rem;
    }

    .modal-box {
      background: #19052b;
      border: 2px solid var(--itqan-gold);
      border-radius: 18px;
      padding: 1.5rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 35px var(--itqan-gold-glow);
      max-height: 85vh;
      overflow-y: auto;
    }

    .poll-bar {
      margin: 8px 0;
      text-align: right;
      font-size: 0.85rem;
    }

    .bar-shell {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 3px;
    }

    .bar-progress {
      height: 14px;
      background: linear-gradient(90deg, var(--itqan-purple-bright), var(--itqan-gold));
      transition: width 1s ease;
      width: 0%;
    }

    .btn-action {
      background: var(--itqan-gold);
      color: #000;
      border: none;
      padding: 8px 24px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 120;
    }

    /* تكيف مخصص للهواتف الذكية */
    @media (max-width: 768px) {
      header {
        padding: 0.4rem 0.8rem;
      }
      .player-status h3 {
        font-size: 0.8rem;
      }
      .player-status span {
        font-size: 0.65rem;
      }
      .btn-tool {
        padding: 4px 7px;
        font-size: 0.7rem;
      }
      main {
        padding: 0.6rem 0.8rem;
        flex-direction: column;
      }
      .ladder-panel {
        display: none;
      }
      .mobile-ladder-btn {
        display: block;
      }
      .options-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .question-screen {
        padding: 0.9rem 0.8rem;
        min-height: 80px;
        font-size: 1rem;
        margin-bottom: 0.8rem;
      }
      .btn-option {
        padding: 0.75rem 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="stage-lighting">
    <div class="beam beam-left"></div>
    <div class="beam beam-right"></div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <!-- 1. الشاشة الافتتاحية -->
  <section id="intro-screen">
    <div class="intro-card">
      <div class="logo-badge" onclick="document.getElementById('logo-upload-input').click()" title="انقر لتغيير الشعار">
        <img id="intro-school-logo" src="شعار_اتقان_بدون_خلفية-removebg-preview.png" alt="شعار مدارس إتقان">
      </div>
      <input type="file" id="logo-upload-input" style="display:none" accept="image/*" onchange="handleLogoUpload(event)">

      <h1 class="intro-title">بنك إتقان المعرفي</h1>
      <p class="intro-motto">«معرفتك رصيدك .. وذكاؤك مفتاح الفوز»</p>

      <div class="form-group">
        <label>اسم المتسابق / الفريق:</label>
        <input type="text" id="player-name-input" class="input-box" placeholder="اكتب اسم المتسابق..." value="بطل إتقان">
      </div>

      <div class="form-group">
        <label>المرحلة الدراسية:</label>
        <select id="stage-select-input" class="select-box">
          <option value="primary_lower">الصفوف الأولية (1 - 3 ابتدائي)</option>
          <option value="primary_upper" selected>الصفوف العليا (4 - 6 ابتدائي)</option>
          <option value="intermediate">المرحلة المتوسطة</option>
          <option value="secondary">المرحلة الثانوية</option>
        </select>
      </div>

      <button class="btn-launch" onclick="launchGame()">دخول ساحة التحدي ⚡</button>
    </div>
  </section>

  <!-- 2. شاشة المسابقة التفاعلية -->
  <div id="game-screen">
    <header>
      <div class="brand-group">
        <div class="header-logo">
          <img id="header-logo-img" src="شعار_اتقان_بدون_خلفية-removebg-preview.png" alt="إتقان">
        </div>
        <div class="player-status">
          <h3 id="display-player-name">بطل إتقان</h3>
          <span id="display-stage-name">الصفوف العليا</span>
        </div>
      </div>

      <div class="lifeline-bar">
        <button class="btn-tool" id="btn-50" onclick="useFiftyFifty()">50:50</button>
        <button class="btn-tool" id="btn-poll" onclick="useAudiencePoll()">👥 الجمهور</button>
        <button class="btn-tool" id="btn-time" onclick="useExtraTime()">⏱️ +30ث</button>
        <button class="btn-tool" style="border-color:var(--cyan)" onclick="toggleFullScreen()">⛶ شاشة كاملة</button>
        <button class="btn-tool" style="border-color:var(--wrong);" onclick="returnToIntro()">خروج</button>
      </div>
    </header>

    <main id="main-stage">
      <div class="arena-content">
        <div class="arena-header">
          <div class="badge-category" id="category-badge">المجال: عام</div>
          <div class="timer-ring" id="timer">45</div>
        </div>

        <div class="question-screen" id="question">جاري عرض السؤال...</div>

        <div class="options-grid">
          <button class="btn-option" onclick="selectAnswer(0)"><span class="choice-sym">أ</span> <span class="choice-text"></span></button>
          <button class="btn-option" onclick="selectAnswer(1)"><span class="choice-sym">ب</span> <span class="choice-text"></span></button>
          <button class="btn-option" onclick="selectAnswer(2)"><span class="choice-sym">ج</span> <span class="choice-text"></span></button>
          <button class="btn-option" onclick="selectAnswer(3)"><span class="choice-sym">د</span> <span class="choice-text"></span></button>
        </div>

        <button class="mobile-ladder-btn" onclick="openModal('modal-mobile-ladder')">📊 رصيد الأسئلة والجوائز</button>
      </div>

      <aside class="ladder-panel" id="ladder"></aside>
    </main>
  </div>

  <!-- نافذة سلم الجوائز للجوال -->
  <div class="modal-overlay" id="modal-mobile-ladder">
    <div class="modal-box">
      <h3 style="color:var(--itqan-gold); margin-bottom: 0.8rem; font-size: 1.1rem;">سلم رصيد الجوائز</h3>
      <div id="mobile-ladder-content" style="display: flex; flex-direction: column-reverse; gap: 4px;"></div>
      <button class="btn-action" onclick="closeModal('modal-mobile-ladder')">إغلاق</button>
    </div>
  </div>

  <!-- نافذة تصويت الجمهور -->
  <div class="modal-overlay" id="modal-poll">
    <div class="modal-box">
      <h3 style="color:var(--itqan-gold); margin-bottom: 0.8rem; font-size: 1.1rem;">نسبة تصويت الجمهور</h3>
      <div id="poll-results"></div>
      <button class="btn-action" onclick="closeModal('modal-poll')">متابعة الحل</button>
    </div>
  </div>

  <!-- نافذة النتيجة النهائية -->
  <div class="modal-overlay" id="modal-result">
    <div class="modal-box">
      <h2 id="result-title" style="margin-bottom: 0.6rem; color: var(--itqan-gold); font-size: 1.3rem;"></h2>
      <p id="result-desc" style="font-size: 0.95rem; color: #cbd5e1;"></p>
      <button class="btn-action" onclick="returnToIntro()">العودة للرئيسية</button>
    </div>
  </div>

  <script>
    // بنك الأسئلة المعتمد المستخرج من دليل المسابقة
    const questionBank = {
      primary_lower: [
        { category: "وطن", question: "ما هي عاصمة المملكة العربية السعودية؟", options: ["جدة", "الرياض", "الدمام", "مكة المكرمة"], correct: 1 },
        { category: "وطن", question: "ما هو لون علم المملكة العربية السعودية؟", options: ["الأبيض", "الأخضر", "الأزرق", "الأحمر"], correct: 1 },

        { category: "علوم", question: "عن أي إنجاز علمي استحق ألبرت أينشتاين جائزة نوبل في الفيزياء عام 1921؟", options: ["معادلة تكافؤ المادة والطاقة", "النظرية النسبية العامة", "تفسير التأثير الكهروضوئي", "تفسير الموجات الكهرومغناطيسية"], correct: 2 },
        { category: "علوم", question: "ما هو الحمض النووي (DNA) في الكائنات الحية؟", options: ["بروتين ناقل للطاقة", "شفرة وراثية تحمل معلومات بناء الكائن الحي ووظائفه", "غشاء يحمي جدار الخلية", "أنزيم محلل للدهون"], correct: 1 },
        { category: "رياضيات", question: "في حساب التفاضل والتكامل، ما المشتقة الأولى للدالة: f(x) = x²؟", options: ["x", "2", "2x", "x³"], correct: 2 },
        { category: "رياضيات", question: "ما قيمة 2 مرفوعة للقوة الخامسة (2⁵)؟", options: ["16", "25", "32", "64"], correct: 2 },
        { category: "رياضيات", question: "إذا كانت النسبة 2:3 ومجموع الجزأين 25، فما قيمة الجزء الأصغر؟", options: ["5", "10", "15", "12"], correct: 1 },
        { category: "لغة وأدب", question: "ما هو التعريف البلاغي لـ (الطباق)؟", options: ["تشابه اللفظين واختلاف المعنى", "الجمع بين الشيء وضده في الكلام", "توافق فواصل الجمل في الحرف الأخير", "المطابقة في الوزن والقافية"], correct: 1 },
        { category: "لغة وأدب", question: "من هو الأديب الذي قام بتعريب وصياغة كتاب (كليلة ودمنة)؟", options: ["الجاحظ", "ابن المقفع", "بديع الزمان الهمذاني", "ابن قتيبة"], correct: 1 },
        { category: "تقنية", question: "ما هو النموذج اللغوي الكبير (LLM) في مجال الذكاء الاصطناعي؟", options: ["خوارزمية لتصميم الواجهات", "نموذج ذكاء اصطناعي مدرب على كميات ضخمة من النصوص لفهم وتوليد اللغة", "معالج رسومي فائق السرعة", "بروتوكول لنقل البيانات"], correct: 1 },
        { category: "بيئة", question: "ما هو التعريف المعتمد لمفهوم (التنمية المستدامة)؟", options: ["إيقاف التوسع الصناعي بالكامل", "تلبية احتياجات الحاضر دون الإضرار بقدرة الأجيال القادمة على تلبية احتياجاتها", "الاعتماد الحصري على الزراعة", "تقليل استخدام التكنولوجيا"], correct: 1 },
        { category: "صحة", question: "لماذا لا تصلح المضادات الحيوية في علاج الأمراض الفيروسية كالرشح؟", options: ["لأنها تسبب الحساسية المفرطة", "لأنها مصممة لاستهداف البكتيريا ولا أثر لها على الفيروسات", "لأنها تخفض المناعة الطبيعية", "لأنها سريعة التحلل في المعدة"], correct: 1 }
      ]
    };

    const points = ["1,000", "5,000", "10,000", "20,000", "50,000", "100,000", "250,000", "500,000", "750,000", "1,000,000"];
    const stageTitles = {
      primary_lower: "الصفوف الأولية",
      primary_upper: "الصفوف العليا",
      intermediate: "المرحلة المتوسطة",
      secondary: "المرحلة الثانوية"
    };

    let currentIdx = 0;
    let currentQuestion = null;
    let timerValue = 45;
    let timerInterval = null;
    let usedQuestions = new Set();
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    const SoundEffects = {
      intro() {
        initAudio();
        const chord = [220, 277.18, 329.63, 440, 554.37];
        chord.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.8);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 2.0);
        });
      },
      click() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      },
      tick() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(900, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      },
      tension() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(160, audioCtx.currentTime + 1.4);
        gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.4);
      },
      correct() {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.08);
          osc.stop(audioCtx.currentTime + idx * 0.08 + 0.45);
        });
      },
      wrong() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      },
      lifeline() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1300, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      }
    };

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById("intro-school-logo").src = e.target.result;
        document.getElementById("header-logo-img").src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // الانتقال المباشر إلى الشاشة التفاعلية
    function launchGame() {
      SoundEffects.intro();
      const pName = document.getElementById("player-name-input").value.trim() || "بطل إتقان";
      const sVal = document.getElementById("stage-select-input").value;

      document.getElementById("display-player-name").textContent = pName;
      document.getElementById("display-stage-name").textContent = stageTitles[sVal];

      const intro = document.getElementById("intro-screen");
      const game = document.getElementById("game-screen");

      intro.style.opacity = "0";
      intro.style.transform = "scale(0.95)";

      setTimeout(() => {
        intro.style.display = "none";
        game.style.display = "flex";
        restartRound();
      }, 400);
    }

    function returnToIntro() {
      clearInterval(timerInterval);
      const intro = document.getElementById("intro-screen");
      const game = document.getElementById("game-screen");

      game.style.display = "none";
      intro.style.display = "flex";
      setTimeout(() => {
        intro.style.opacity = "1";
        intro.style.transform = "scale(1)";
      }, 30);
      closeModal("modal-result");
    }

    function restartRound() {
      initAudio();
      usedQuestions.clear();
      currentIdx = 0;
      document.querySelectorAll(".btn-tool").forEach(b => b.disabled = false);
      closeModal("modal-result");
      buildLadders();
      loadNextQuestion();
    }

    function buildLadders() {
      const desktopLadder = document.getElementById("ladder");
      const mobileLadder = document.getElementById("mobile-ladder-content");
      desktopLadder.innerHTML = "";
      mobileLadder.innerHTML = "";

      points.forEach((pts, i) => {
        const item = document.createElement("div");
        item.className = `ladder-step ${i === currentIdx ? 'active' : ''} ${i === 2 || i === 6 || i === 9 ? 'milestone' : ''}`;
        item.id = `ladder-step-${i}`;
        item.innerHTML = `<span>سؤال ${i + 1}</span> <span>${pts}</span>`;

        const clone = item.cloneNode(true);
        clone.id = `mobile-step-${i}`;

        desktopLadder.appendChild(item);
        mobileLadder.appendChild(clone);
      });
    }

    function updateLadderHighlights() {
      points.forEach((_, i) => {
        const dItem = document.getElementById(`ladder-step-${i}`);
        const mItem = document.getElementById(`mobile-step-${i}`);
        if (dItem) {
          if (i === currentIdx) dItem.classList.add("active");
          else dItem.classList.remove("active");
        }
        if (mItem) {
          if (i === currentIdx) mItem.classList.add("active");
          else mItem.classList.remove("active");
        }
      });
    }

    function loadNextQuestion() {
      const stage = document.getElementById("stage-select-input").value;
      const pool = questionBank[stage] || questionBank.primary_upper;

      let available = pool.filter(q => !usedQuestions.has(q.question));
      if (available.length === 0) {
        usedQuestions.clear();
        available = pool;
      }

      currentQuestion = available[Math.floor(Math.random() * available.length)];
      usedQuestions.add(currentQuestion.question);

      document.getElementById("category-badge").textContent = `المجال: ${currentQuestion.category}`;
      document.getElementById("question").textContent = currentQuestion.question;

      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach((btn, i) => {
        btn.querySelector(".choice-text").textContent = currentQuestion.options[i];
        btn.className = "btn-option";
        btn.disabled = false;
        btn.style.visibility = "visible";
      });

      updateLadderHighlights();
      resetTimer();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerValue = 45;
      const timerEl = document.getElementById("timer");
      timerEl.textContent = timerValue;
      timerEl.classList.remove("timer-critical");

      timerInterval = setInterval(() => {
        timerValue--;
        timerEl.textContent = timerValue;

        if (timerValue <= 10) {
          timerEl.classList.add("timer-critical");
          SoundEffects.tick();
        }

        if (timerValue <= 0) {
          clearInterval(timerInterval);
          triggerShake();
          SoundEffects.wrong();
          endGame(false, "انتهى الوقت المحدد للمحاولة!");
        }
      }, 1000);
    }

    function selectAnswer(choiceIdx) {
      clearInterval(timerInterval);
      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach(b => b.disabled = true);
      buttons[choiceIdx].classList.add("selected");
      SoundEffects.tension();

      setTimeout(() => {
        if (choiceIdx === currentQuestion.correct) {
          buttons[choiceIdx].classList.remove("selected");
          buttons[choiceIdx].classList.add("correct");
          SoundEffects.correct();
          launchConfetti(80);

          setTimeout(() => {
            currentIdx++;
            if (currentIdx >= points.length) {
              const playerName = document.getElementById("player-name-input").value || "المتسابق";
              endGame(true, `ألف مبارك للبطل (${playerName})! حققت المركز الأول في مسابقة إتقان المعرفية 🏆`);
            } else {
              loadNextQuestion();
            }
          }, 1500);
        } else {
          buttons[choiceIdx].classList.remove("selected");
          buttons[choiceIdx].classList.add("wrong");
          buttons[currentQuestion.correct].classList.add("correct");
          triggerShake();
          SoundEffects.wrong();
          setTimeout(() => endGame(false, "إجابة غير صحيحة. رصيدك المعرفي يزداد بالتجربة والمحاولة المستمرة!"), 1800);
        }
      }, 1400);
    }

    function triggerShake() {
      const stage = document.getElementById("main-stage");
      stage.classList.add("shake-screen");
      setTimeout(() => stage.classList.remove("shake-screen"), 600);
    }

    function useFiftyFifty() {
      SoundEffects.lifeline();
      document.getElementById("btn-50").disabled = true;
      let wrong = [0, 1, 2, 3].filter(i => i !== currentQuestion.correct);
      wrong.sort(() => Math.random() - 0.5);
      const buttons = document.querySelectorAll(".btn-option");
      buttons[wrong[0]].style.visibility = "hidden";
      buttons[wrong[1]].style.visibility = "hidden";
    }

    function useExtraTime() {
      SoundEffects.lifeline();
      document.getElementById("btn-time").disabled = true;
      timerValue += 30;
      document.getElementById("timer").textContent = timerValue;
    }

    function useAudiencePoll() {
      SoundEffects.lifeline();
      document.getElementById("btn-poll").disabled = true;
      const pollBox = document.getElementById("poll-results");
      pollBox.innerHTML = "";

      let percentages = [10, 10, 10, 10];
      percentages[currentQuestion.correct] += 50;
      percentages = percentages.map(p => Math.floor(p + (Math.random() * 8)));

      currentQuestion.options.forEach((opt, idx) => {
        pollBox.innerHTML += `
          <div class="poll-bar">
            <span>${opt} (${percentages[idx]}%)</span>
            <div class="bar-shell">
              <div class="bar-progress" style="width: ${percentages[idx]}%;"></div>
            </div>
          </div>
        `;
      });

      openModal("modal-poll");
    }

    function openModal(id) {
      document.getElementById(id).style.display = "flex";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    function endGame(isWin, msg) {
      const modal = document.getElementById("modal-result");
      document.getElementById("result-title").textContent = isWin ? "🏆 فوز مستحق وإتقان باهر!" : "انتهت المسابقة";
      document.getElementById("result-desc").textContent = msg;
      modal.style.display = "flex";
      if (isWin) launchConfetti(300);
    }

    /* تأثير القصاصات الاحتفالية */
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    let confetti = [];
    let animatingConfetti = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti(count = 70) {
      const colors = ["#f5b301", "#ba68c8", "#00e5ff", "#10b981", "#ffffff"];
      for (let i = 0; i < count; i++) {
        confetti.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          r: Math.random() * 5 + 3,
          dx: (Math.random() - 0.5) * 14,
          dy: (Math.random() - 0.5) * 14 - 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.random() * 10,
          tiltAngle: 0,
          tiltAngleInc: Math.random() * 0.08 + 0.04
        });
      }
      if (!animatingConfetti) updateConfetti();
    }

    function updateConfetti() {
      animatingConfetti = true;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confetti.forEach((p, index) => {
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.22;
        p.tiltAngle += p.tiltAngleInc;
        p.tilt = Math.sin(p.tiltAngle) * 12;

        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
        ctx.stroke();

        if (p.y > canvas.height) confetti.splice(index, 1);
      });

      if (confetti.length > 0) {
        requestAnimationFrame(updateConfetti);
      } else {
        animatingConfetti = false;
      }
    }
  </script>
</body>
