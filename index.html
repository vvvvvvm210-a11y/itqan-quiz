<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بنك إتقان المعرفي - البث المباشر والتحدي التفاعلي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --itqan-purple: #5b1387;
      --itqan-purple-deep: #1d0330;
      --itqan-purple-light: #a855f7;
      --itqan-gold: #fbbf24;
      --itqan-gold-glow: rgba(251, 191, 36, 0.6);
      --bg-dark: #07020d;
      --cyan: #38bdf8;
      --correct: #10b981;
      --wrong: #ef4444;
      --selected: #f97316;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* أضواء الاستوديو الخلفية */
    .studio-lights {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .light-beam {
      position: absolute;
      top: -20%;
      width: 400px;
      height: 150%;
      background: radial-gradient(ellipse at center, rgba(168, 85, 247, 0.22) 0%, transparent 65%);
      transform-origin: top center;
      animation: sweep 12s ease-in-out infinite alternate;
    }

    .light-beam-left { left: 10%; animation-delay: -2s; }
    .light-beam-right { right: 10%; animation-duration: 15s; }

    @keyframes sweep {
      0% { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }

    /* شاشة البداية */
    #welcome-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 2;
    }

    .glass-card {
      background: rgba(29, 3, 48, 0.7);
      border: 2px solid var(--card-border, rgba(251, 191, 36, 0.35));
      border-radius: 28px;
      padding: 3rem 2.5rem;
      max-width: 620px;
      width: 100%;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(91, 19, 135, 0.4);
      text-align: center;
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .main-logo {
      width: 130px;
      height: 130px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      border: 3px solid var(--itqan-gold);
      background: #ffffff;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px var(--itqan-gold-glow);
      cursor: pointer;
      transition: transform 0.3s;
    }

    .main-logo:hover {
      transform: scale(1.06);
    }

    .main-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .welcome-title {
      font-size: 2.3rem;
      font-weight: 900;
      color: var(--itqan-gold);
      text-shadow: 0 0 20px var(--itqan-gold-glow);
      margin-bottom: 0.3rem;
    }

    .welcome-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--itqan-gold);
    }

    .input-text, .select-stage {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1.5px solid rgba(251, 191, 36, 0.3);
      background: rgba(10, 4, 20, 0.85);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      transition: border 0.3s, box-shadow 0.3s;
    }

    .input-text:focus, .select-stage:focus {
      border-color: var(--itqan-gold);
      box-shadow: 0 0 15px var(--itqan-gold-glow);
    }

    .select-stage option {
      background: #1d0330;
      color: #fff;
    }

    .btn-start {
      width: 100%;
      background: linear-gradient(135deg, var(--itqan-gold) 0%, #d97706 100%);
      color: #05010a;
      font-size: 1.35rem;
      font-weight: 900;
      padding: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(245, 179, 1, 0.45);
      transition: all 0.25s ease;
      margin-top: 1rem;
    }

    .btn-start:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(245, 179, 1, 0.7);
    }

    /* واجهة المسابقة */
    #game-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      z-index: 2;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2.5rem;
      background: rgba(10, 4, 20, 0.85);
      border-bottom: 2px solid var(--itqan-gold);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--itqan-gold);
      background: #fff;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .player-info h3 {
      font-size: 1.15rem;
      color: var(--itqan-gold);
    }

    .player-info span {
      font-size: 0.85rem;
      color: var(--cyan);
    }

    .lifelines {
      display: flex;
      gap: 12px;
    }

    .btn-help {
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid var(--itqan-gold);
      color: var(--itqan-gold);
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn-help:hover:not(:disabled) {
      background: var(--itqan-gold);
      color: #000;
      box-shadow: 0 0 15px var(--itqan-gold-glow);
      transform: translateY(-2px);
    }

    .btn-help:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: #64748b;
      color: #64748b;
      text-decoration: line-through;
    }

    main {
      flex: 1;
      display: flex;
      padding: 2rem;
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .stage-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .tag-category {
      background: rgba(106, 27, 154, 0.45);
      border: 1.5px solid var(--itqan-purple-light);
      color: #f3e8ff;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }

    .timer-circle {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 3px solid var(--itqan-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 900;
      background: #140526;
      color: var(--itqan-gold);
      box-shadow: 0 0 20px var(--itqan-gold-glow);
      transition: all 0.3s;
    }

    .timer-warning {
      border-color: var(--wrong) !important;
      color: var(--wrong) !important;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8) !important;
      animation: heartbeat 0.8s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* صناديق الأسئلة والخيارات بتصميم مضلع أنيق */
    .question-box {
      background: linear-gradient(180deg, rgba(35, 12, 60, 0.85) 0%, rgba(17, 4, 30, 0.95) 100%);
      border: 2px solid var(--itqan-gold);
      border-radius: 20px;
      padding: 2.5rem;
      font-size: 1.55rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2rem;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(251, 191, 36, 0.15);
      line-height: 1.6;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn-option {
      background: linear-gradient(90deg, rgba(35, 12, 60, 0.75) 0%, rgba(20, 5, 36, 0.85) 100%);
      border: 1.5px solid rgba(251, 191, 36, 0.3);
      border-radius: 14px;
      color: #fff;
      padding: 1.2rem 1.6rem;
      font-size: 1.25rem;
      font-weight: 600;
      text-align: right;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      position: relative;
    }

    .btn-option .badge {
      color: var(--itqan-gold);
      margin-left: 14px;
      font-weight: 900;
      font-size: 1.3rem;
    }

    .btn-option:hover:not(:disabled) {
      border-color: var(--itqan-gold);
      background: rgba(106, 27, 154, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    /* حالة تثبيت الإجابة - ترقب */
    .btn-option.selected {
      background: var(--selected) !important;
      color: #fff !important;
      border-color: #ffedd5 !important;
      box-shadow: 0 0 25px rgba(249, 115, 22, 0.7);
      animation: pulseSelection 0.5s infinite alternate;
    }

    @keyframes pulseSelection {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }

    /* إجابة صحيحة */
    .btn-option.correct {
      background: var(--correct) !important;
      color: #fff !important;
      border-color: #6ee7b7 !important;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.9);
      animation: flashSuccess 0.4s ease-in-out 3;
    }

    @keyframes flashSuccess {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* إجابة خاطئة */
    .btn-option.wrong {
      background: var(--wrong) !important;
      color: #fff !important;
      border-color: #fca5a5 !important;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
    }

    .btn-option:disabled {
      cursor: default;
    }

    /* سلم النقاط الجانبي */
    .sidebar {
      flex: 1;
      background: rgba(29, 3, 48, 0.8);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 20px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column-reverse;
      gap: 5px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .ladder-step {
      display: flex;
      justify-content: space-between;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.3s;
    }

    .ladder-step.active {
      background: linear-gradient(90deg, rgba(106, 27, 154, 0.8), rgba(251, 191, 36, 0.4));
      border: 1px solid var(--itqan-gold);
      color: #fff;
      transform: scale(1.04);
      box-shadow: 0 0 15px var(--itqan-gold-glow);
    }

    .ladder-step.milestone {
      color: var(--itqan-gold);
    }

    /* اهتزاز الشاشة عند الخطأ */
    .shake-screen {
      animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* لوحة القصاصات والاحتفالات */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }

    /* النوافذ التفاعلية */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 1, 8, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-content {
      background: #1d0330;
      border: 2px solid var(--itqan-gold);
      border-radius: 22px;
      padding: 2.5rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 45px var(--itqan-gold-glow);
    }

    .poll-bar {
      margin: 12px 0;
      text-align: right;
    }

    .bar-bg {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 4px;
    }

    .bar-fill {
      height: 18px;
      background: linear-gradient(90deg, var(--itqan-purple-light), var(--itqan-gold));
      transition: width 1s ease;
      width: 0%;
    }

    .btn-action {
      background: var(--itqan-gold);
      color: #000;
      border: none;
      padding: 12px 30px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 1.5rem;
      font-size: 1.1rem;
    }

    @media (max-width: 900px) {
      main {
        flex-direction: column-reverse;
        padding: 1rem;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="studio-lights">
    <div class="light-beam light-beam-left"></div>
    <div class="light-beam light-beam-right"></div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <!-- شاشة الدخول الرئيسية -->
  <section id="welcome-screen">
    <div class="glass-card">
      <div class="main-logo" onclick="document.getElementById('logo-file-input').click()" title="انقر لاستبدال الشعار">
        <img id="school-logo" src="شعار_اتقان_بدون_خلفية-removebg-preview.png" alt="مدارس إتقان التربية">
      </div>
      <input type="file" id="logo-file-input" style="display:none" accept="image/*" onchange="uploadLogo(event)">

      <h1 class="welcome-title">بنك إتقان المعرفي</h1>
      <p class="welcome-subtitle">«معرفتك رصيدك .. وذكاؤك مفتاح الفوز»</p>

      <div class="form-group">
        <label>اسم المتسابق / الفريق:</label>
        <input type="text" id="player-name" class="input-text" placeholder="اكتب اسم المتسابق..." value="بطل إتقان">
      </div>

      <div class="form-group">
        <label>المرحلة المستهدفة:</label>
        <select id="stage-select" class="select-stage">
          <option value="primary_lower">الصفوف الأولية (أول - ثاني - ثالث ابتدائي)</option>
          <option value="primary_upper" selected>الصفوف العليا (رابع - خامس - سادس ابتدائي)</option>
          <option value="intermediate">المرحلة المتوسطة</option>
          <option value="secondary">المرحلة الثانوية</option>
        </select>
      </div>

      <button class="btn-start" onclick="startGame()">دخول ساحة التحدي ⚡</button>
    </div>
  </section>

  <!-- شاشة المسابقة التفاعلية -->
  <div id="game-screen">
    <header>
      <div class="brand">
        <div class="nav-logo">
          <img id="nav-school-logo" src="شعار_اتقان_بدون_خلفية-removebg-preview.png" alt="إتقان">
        </div>
        <div class="player-info">
          <h3 id="display-player-name">بطل إتقان</h3>
          <span id="display-stage-name">الصفوف العليا</span>
        </div>
      </div>

      <div class="lifelines">
        <button class="btn-help" id="btn-50" onclick="useFiftyFifty()">50:50</button>
        <button class="btn-help" id="btn-poll" onclick="useAudiencePoll()">👥 تصويت الجمهور</button>
        <button class="btn-help" id="btn-time" onclick="useExtraTime()">⏱️ +30 ثانية</button>
        <button class="btn-help" style="border-color:var(--cyan)" onclick="toggleFullScreen()">⛶ شاشة كاملة</button>
        <button class="btn-help" style="border-color:#ef4444;" onclick="quitToHome()">خروج</button>
      </div>
    </header>

    <main id="main-stage">
      <div class="stage-area">
        <div class="status-bar">
          <div class="tag-category" id="category-badge">المجال: عام</div>
          <div class="timer-circle" id="timer">45</div>
        </div>

        <div class="question-box" id="question">جاري عرض السؤال...</div>

        <div class="options-grid">
          <button class="btn-option" onclick="selectAnswer(0)"><span class="badge">أ</span> <span class="text"></span></button>
          <button class="btn-option" onclick="selectAnswer(1)"><span class="badge">ب</span> <span class="text"></span></button>
          <button class="btn-option" onclick="selectAnswer(2)"><span class="badge">ج</span> <span class="text"></span></button>
          <button class="btn-option" onclick="selectAnswer(3)"><span class="badge">د</span> <span class="text"></span></button>
        </div>
      </div>

      <aside class="sidebar" id="ladder"></aside>
    </main>
  </div>

  <!-- نافذة تصويت الجمهور -->
  <div class="modal" id="modal-poll">
    <div class="modal-content">
      <h3 style="color:var(--itqan-gold); margin-bottom: 1rem;">نتائج تصويت الجمهور</h3>
      <div id="poll-results"></div>
      <button class="btn-action" onclick="closeModal('modal-poll')">متابعة الحل</button>
    </div>
  </div>

  <!-- نافذة النتيجة النهائية -->
  <div class="modal" id="modal-result">
    <div class="modal-content">
      <h2 id="result-title" style="margin-bottom: 1rem; color: var(--itqan-gold);"></h2>
      <p id="result-desc" style="font-size: 1.15rem; color: #cbd5e1;"></p>
      <button class="btn-action" onclick="returnToHome()">العودة للرئيسية</button>
    </div>
  </div>

  <script>
    // بنك الأسئلة الشامل المستخرج من الدليل
    const questionBank = {
      primary_lower: [
        { category: "وطن", question: "ما هي عاصمة المملكة العربية السعودية؟", options: ["جدة", "الرياض", "الدمام", "مكة المكرمة"], correct: 1 },
        { category: "وطن", question: "ما هو لون علم المملكة العربية السعودية؟", options: ["الأبيض", "الأخضر", "الأزرق", "الأحمر"], correct: 1 },
        { category: "وطن", question: "ما اسم المناسبة الوطنية التي توافق 23 سبتمبر من كل عام؟", options: ["يوم التأسيس", "يوم العلم", "اليوم الوطني السعودي", "يوم المعلم"], correct: 2 },
        { category: "وطن", question: "ما اسم المناسبة الوطنية التي توافق 22 فبراير من كل عام؟", options: ["اليوم الوطني", "يوم التأسيس", "يوم الشجرة", "يوم الطفل"], correct: 1 },
        { category: "إسلاميات", question: "كم عدد أركان الإسلام؟", options: ["3 أركان", "4 أركان", "5 أركان", "6 أركان"], correct: 2 },
        { category: "إسلاميات", question: "ما هي قبلة المسلمين في الصلاة؟", options: ["المسجد الأقصى", "المسجد النبوي", "الكعبة المشرفة", "مسجد قباء"], correct: 2 },
        { category: "إسلاميات", question: "ما الشهر الذي يصومه المسلمون في كل عام؟", options: ["شعبان", "رمضان", "شوال", "ذو الحجة"], correct: 1 },
        { category: "إسلاميات", question: "من هو أول الخلفاء الراشدين رضي الله عنه؟", options: ["عمر بن الخطاب", "عثمان بن عفان", "أبو بكر الصديق", "علي بن أبي طالب"], correct: 2 },
        { category: "جغرافيا", question: "ما هي عاصمة جمهورية مصر العربية؟", options: ["الإسكندرية", "القاهرة", "الجيزة", "أسوان"], correct: 1 },
        { category: "جغرافيا", question: "ما هي عاصمة فرنسا؟", options: ["لندن", "مدريد", "باريس", "روما"], correct: 2 },

        { category: "لغة وأدب", question: "من هو الأديب الذي قام بتعريب وصياغة كتاب (كليلة ودمنة)؟", options: ["الجاحظ", "ابن المقفع", "بديع الزمان الهمذاني", "ابن قتيبة"], correct: 1 },
        { category: "تقنية", question: "ما هو النموذج اللغوي الكبير (LLM) في مجال الذكاء الاصطناعي؟", options: ["خوارزمية لتصميم الواجهات", "نموذج ذكاء اصطناعي مدرب على كميات ضخمة من النصوص لفهم وتوليد اللغة", "معالج رسومي فائق السرعة", "بروتوكول لنقل البيانات"], correct: 1 },
        { category: "بيئة", question: "ما هو التعريف المعتمد لمفهوم (التنمية المستدامة)؟", options: ["إيقاف التوسع الصناعي بالكامل", "تلبية احتياجات الحاضر دون الإضرار بقدرة الأجيال القادمة على تلبية احتياجاتها", "الاعتماد الحصري على الزراعة", "تقليل استخدام التكنولوجيا"], correct: 1 },
        { category: "صحة", question: "لماذا لا تصلح المضادات الحيوية في علاج الأمراض الفيروسية كالرشح؟", options: ["لأنها تسبب الحساسية المفرطة", "لأنها مصممة لاستهداف البكتيريا ولا أثر لها على الفيروسات", "لأنها تخفض المناعة الطبيعية", "لأنها سريعة التحلل في المعدة"], correct: 1 }
      ]
    };

    const points = ["1,000", "5,000", "10,000", "20,000", "50,000", "100,000", "250,000", "500,000", "750,000", "1,000,000"];
    const stageNames = {
      primary_lower: "الصفوف الأولية",
      primary_upper: "الصفوف العليا",
      intermediate: "المرحلة المتوسطة",
      secondary: "المرحلة الثانوية"
    };

    let selectedStage = "primary_upper";
    let activeQuestions = [];
    let currentIdx = 0;
    let currentQuestion = null;
    let timerValue = 45;
    let timerInterval = null;
    let usedQuestionTexts = new Set();
    let audioCtx = null;

    // تهيئة الصوتيات عند التفاعل
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // مكتبة أصوات مدمجة
    const SoundEffects = {
      click() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      },
      tick() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      },
      tension() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(160, audioCtx.currentTime + 1.8);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.8);
      },
      correct() {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // نغمة وترية مبهجة (C major)
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.1);
          osc.stop(audioCtx.currentTime + idx * 0.1 + 0.5);
        });
      },
      wrong() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      },
      lifeline() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      }
    };

    function uploadLogo(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById("school-logo").src = e.target.result;
        document.getElementById("nav-school-logo").src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function startGame() {
      initAudio();
      SoundEffects.click();

      const name = document.getElementById("player-name").value.trim() || "بطل إتقان";
      selectedStage = document.getElementById("stage-select").value;

      document.getElementById("display-player-name").textContent = name;
      document.getElementById("display-stage-name").textContent = stageNames[selectedStage];

      activeQuestions = [...questionBank[selectedStage]];
      usedQuestionTexts.clear();
      currentIdx = 0;

      document.getElementById("welcome-screen").style.display = "none";
      document.getElementById("game-screen").style.display = "flex";

      document.querySelectorAll(".btn-help").forEach(b => b.disabled = false);
      loadNextQuestion();
    }

    function initLadder() {
      const ladderEl = document.getElementById("ladder");
      ladderEl.innerHTML = "";
      points.forEach((pts, i) => {
        const item = document.createElement("div");
        item.className = `ladder-step ${i === currentIdx ? 'active' : ''} ${i === 2 || i === 6 || i === 9 ? 'milestone' : ''}`;
        item.innerHTML = `<span>السؤال ${i + 1}</span> <span>${pts}</span>`;
        ladderEl.appendChild(item);
      });
    }

    function loadNextQuestion() {
      let available = activeQuestions.filter(q => !usedQuestionTexts.has(q.question));
      if (available.length === 0) {
        usedQuestionTexts.clear();
        available = activeQuestions;
      }

      currentQuestion = available[Math.floor(Math.random() * available.length)];
      usedQuestionTexts.add(currentQuestion.question);

      document.getElementById("category-badge").textContent = `المجال: ${currentQuestion.category}`;
      document.getElementById("question").textContent = currentQuestion.question;

      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach((btn, i) => {
        btn.querySelector(".text").textContent = currentQuestion.options[i];
        btn.className = "btn-option";
        btn.disabled = false;
        btn.style.visibility = "visible";
      });

      initLadder();
      resetTimer();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerValue = 45;
      const timerEl = document.getElementById("timer");
      timerEl.textContent = timerValue;
      timerEl.classList.remove("timer-warning");

      timerInterval = setInterval(() => {
        timerValue--;
        timerEl.textContent = timerValue;

        if (timerValue <= 10) {
          timerEl.classList.add("timer-warning");
          SoundEffects.tick();
        }

        if (timerValue <= 0) {
          clearInterval(timerInterval);
          triggerShake();
          SoundEffects.wrong();
          endGame(false, "انتهى الوقت المسموح للتفكير في الإجابة!");
        }
      }, 1000);
    }

    function selectAnswer(choiceIdx) {
      clearInterval(timerInterval);
      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach(b => b.disabled = true);
      buttons[choiceIdx].classList.add("selected");
      SoundEffects.tension();

      // فاصل ترقب لمدة ثانية ونصف
      setTimeout(() => {
        if (choiceIdx === currentQuestion.correct) {
          buttons[choiceIdx].classList.remove("selected");
          buttons[choiceIdx].classList.add("correct");
          SoundEffects.correct();
          launchConfetti();

          setTimeout(() => {
            currentIdx++;
            if (currentIdx >= points.length) {
              endGame(true, "مبارك لك الفوز بالمركز الأول في بنك إتقان المعرفي!");
            } else {
              loadNextQuestion();
            }
          }, 1800);
        } else {
          buttons[choiceIdx].classList.remove("selected");
          buttons[choiceIdx].classList.add("wrong");
          buttons[currentQuestion.correct].classList.add("correct");
          triggerShake();
          SoundEffects.wrong();
          setTimeout(() => endGame(false, "إجابة خاطئة. لقد اكتسبت علماً ورصيداً معرفياً مميزاً!"), 2000);
        }
      }, 1500);
    }

    function triggerShake() {
      const stage = document.getElementById("main-stage");
      stage.classList.add("shake-screen");
      setTimeout(() => stage.classList.remove("shake-screen"), 600);
    }

    function useFiftyFifty() {
      SoundEffects.lifeline();
      document.getElementById("btn-50").disabled = true;
      let wrongIndices = [0, 1, 2, 3].filter(i => i !== currentQuestion.correct);
      wrongIndices.sort(() => Math.random() - 0.5);
      const buttons = document.querySelectorAll(".btn-option");
      buttons[wrongIndices[0]].style.visibility = "hidden";
      buttons[wrongIndices[1]].style.visibility = "hidden";
    }

    function useExtraTime() {
      SoundEffects.lifeline();
      document.getElementById("btn-time").disabled = true;
      timerValue += 30;
      document.getElementById("timer").textContent = timerValue;
    }

    function useAudiencePoll() {
      SoundEffects.lifeline();
      document.getElementById("btn-poll").disabled = true;
      const pollBox = document.getElementById("poll-results");
      pollBox.innerHTML = "";

      let percentages = [10, 10, 10, 10];
      percentages[currentQuestion.correct] += 50;
      percentages = percentages.map(p => Math.floor(p + (Math.random() * 10)));

      currentQuestion.options.forEach((opt, idx) => {
        pollBox.innerHTML += `
          <div class="poll-bar">
            <span>${opt} (${percentages[idx]}%)</span>
            <div class="bar-bg">
              <div class="bar-fill" style="width: ${percentages[idx]}%;"></div>
            </div>
          </div>
        `;
      });

      document.getElementById("modal-poll").style.display = "flex";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    function endGame(isWin, msg) {
      const modal = document.getElementById("modal-result");
      document.getElementById("result-title").textContent = isWin ? "🏆 فوز وإتقان مستحق!" : "انتهت المسابقة";
      document.getElementById("result-desc").textContent = msg;
      modal.style.display = "flex";
      if (isWin) launchConfetti(300);
    }

    function returnToHome() {
      closeModal("modal-result");
      document.getElementById("game-screen").style.display = "none";
      document.getElementById("welcome-screen").style.display = "flex";
    }

    function quitToHome() {
      clearInterval(timerInterval);
      returnToHome();
    }

    // احتفال القصاصات المتطايرة (Confetti Canvas)
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    let confetti = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti(count = 70) {
      const colors = ["#fbbf24", "#a855f7", "#38bdf8", "#10b981", "#ffffff"];
      for (let i = 0; i < count; i++) {
        confetti.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          r: Math.random() * 6 + 4,
          dx: (Math.random() - 0.5) * 16,
          dy: (Math.random() - 0.5) * 16 - 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.random() * 10,
          tiltAngle: 0,
          tiltAngleInc: Math.random() * 0.07 + 0.05
        });
      }
      if (!animatingConfetti) updateConfetti();
    }

    let animatingConfetti = false;
    function updateConfetti() {
      animatingConfetti = true;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confetti.forEach((p, index) => {
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.2; // جاذبية
        p.tiltAngle += p.tiltAngleInc;
        p.tilt = Math.sin(p.tiltAngle) * 15;

        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
        ctx.stroke();

        if (p.y > canvas.height) confetti.splice(index, 1);
      });

      if (confetti.length > 0) {
        requestAnimationFrame(updateConfetti);
      } else {
        animatingConfetti = false;
      }
    }
  </script>
</body>
</html>
