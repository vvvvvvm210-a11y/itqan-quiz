<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>بنك إتقان المعرفي | مدارس إتقان التربية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* المتغيرات العامة - الوضع الفاتح كهوية رئيسية */
    :root {
      --bg-gradient: radial-gradient(circle at 50% 15%, #ffffff 0%, #f7f0fa 60%, #ede0f5 100%);
      --header-bg: rgba(255, 255, 255, 0.96);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(106, 27, 154, 0.18);
      --itqan-purple: #6a1b9a;
      --itqan-purple-deep: #4a148c;
      --itqan-purple-light: #9c27b0;
      --itqan-purple-soft: rgba(106, 27, 154, 0.08);
      --accent-color: #7b1fa2;
      --accent-glow: rgba(106, 27, 154, 0.25);
      --cyan: #0284c7;
      --text: #210338;
      --text-muted: #64748b;
      --opt-bg: #ffffff;
      --opt-border: rgba(106, 27, 154, 0.2);
      --correct: #10b981;
      --wrong: #ef4444;
      --selected: #ea580c;
    }

    /* الوضع الداكن */
    body.dark-theme {
      --bg-gradient: radial-gradient(circle at 50% 15%, #25053b 0%, #10021c 65%, #050009 100%);
      --header-bg: rgba(16, 2, 28, 0.95);
      --card-bg: rgba(28, 8, 48, 0.88);
      --card-border: rgba(156, 39, 176, 0.35);
      --itqan-purple-soft: rgba(156, 39, 176, 0.2);
      --accent-color: #ba68c8;
      --accent-glow: rgba(186, 104, 200, 0.4);
      --cyan: #38bdf8;
      --text: #ffffff;
      --text-muted: #cbd5e1;
      --opt-bg: linear-gradient(90deg, rgba(38, 10, 66, 0.8) 0%, rgba(20, 4, 36, 0.9) 100%);
      --opt-border: rgba(156, 39, 176, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      height: 100%;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* أضواء المسرح الهادئة */
    .studio-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .spotlight {
      position: absolute;
      top: -25%;
      width: 360px;
      height: 150%;
      background: radial-gradient(ellipse at center, rgba(106, 27, 154, 0.08) 0%, transparent 65%);
      transform-origin: top center;
      animation: sweepLights 14s ease-in-out infinite alternate;
    }
    body.dark-theme .spotlight {
      background: radial-gradient(ellipse at center, rgba(156, 39, 176, 0.2) 0%, transparent 65%);
    }
    .spotlight-left { left: -10%; animation-delay: -3s; }
    .spotlight-right { right: -10%; animation-duration: 16s; }

    @keyframes sweepLights {
      0% { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }

    #flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 95;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #flash-overlay.flash-correct {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, transparent 75%);
      opacity: 1;
    }
    #flash-overlay.flash-wrong {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.35) 0%, transparent 75%);
      opacity: 1;
    }

    /* -------------------------------------------------------------
       1. الشاشة الافتتاحية
       ------------------------------------------------------------- */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      text-align: center;
      background: inherit;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .intro-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      padding: 2.2rem 1.6rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 40px rgba(106, 27, 154, 0.12);
      backdrop-filter: blur(16px);
      position: relative;
    }
    body.dark-theme .intro-card {
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(106, 27, 154, 0.35);
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 16px;
      border: 1.5px solid rgba(106, 27, 154, 0.2);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      margin-bottom: 1.2rem;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .logo-badge:hover {
      transform: scale(1.03);
    }

    .logo-badge img {
      max-height: 65px;
      width: auto;
      object-fit: contain;
    }

    .intro-title {
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 900;
      color: var(--itqan-purple);
      margin-bottom: 0.2rem;
    }
    body.dark-theme .intro-title {
      color: #f3e8ff;
      text-shadow: 0 0 15px rgba(186, 104, 200, 0.5);
    }

    .intro-motto {
      font-size: 0.95rem;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 1.8rem;
    }

    .form-group {
      margin-bottom: 1.1rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--itqan-purple-deep);
    }
    body.dark-theme .form-group label {
      color: var(--itqan-purple-bright);
    }

    .input-box, .select-box {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1.2px solid var(--card-border);
      background: #ffffff;
      color: #1e0538;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    body.dark-theme .input-box, body.dark-theme .select-box {
      background: rgba(10, 2, 20, 0.9);
      color: #fff;
    }

    .input-box:focus, .select-box:focus {
      border-color: var(--itqan-purple);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-launch {
      width: 100%;
      background: linear-gradient(135deg, var(--itqan-purple) 0%, var(--itqan-purple-deep) 100%);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 13px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(106, 27, 154, 0.35);
      transition: all 0.25s ease;
      margin-top: 0.5rem;
    }

    .btn-launch:active {
      transform: scale(0.98);
    }

    /* -------------------------------------------------------------
       2. شاشة المسابقة المباشرة
       ------------------------------------------------------------- */
    #game-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      width: 100%;
      max-width: 100%;
    }

    header {
      background: var(--header-bg);
      border-bottom: 2px solid var(--itqan-purple);
      backdrop-filter: blur(10px);
      padding: 0.5rem 1rem;
      flex-shrink: 0;
      width: 100%;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
    }

    .header-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo-card {
      background: #ffffff;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid rgba(106, 27, 154, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .header-logo-card img {
      max-height: 38px;
      width: auto;
      object-fit: contain;
    }

    .player-details h3 {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--itqan-purple);
      line-height: 1.2;
    }
    body.dark-theme .player-details h3 {
      color: #f3e8ff;
    }

    .player-details span {
      font-size: 0.72rem;
      color: var(--cyan);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--itqan-purple-soft);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      border-color: var(--itqan-purple);
      transform: scale(1.05);
    }

    .lifeline-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .btn-lifeline {
      background: var(--itqan-purple-soft);
      border: 1.2px solid var(--itqan-purple);
      color: var(--itqan-purple-deep);
      padding: 6px 4px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
    }
    body.dark-theme .btn-lifeline {
      color: #f3e8ff;
      border-color: var(--itqan-purple-bright);
    }

    .btn-lifeline:hover:not(:disabled) {
      background: var(--itqan-purple);
      color: #fff;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-lifeline:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: #94a3b8;
      color: #94a3b8;
      text-decoration: line-through;
    }

    main {
      flex: 1;
      display: flex;
      padding: 0.8rem 1.2rem;
      gap: 1.2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      align-items: center;
      overflow-y: auto;
    }

    .arena-content {
      flex: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }

    .arena-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .badge-category {
      background: var(--itqan-purple-soft);
      border: 1px solid var(--itqan-purple);
      color: var(--itqan-purple);
      padding: 4px 14px;
      border-radius: 18px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    body.dark-theme .badge-category {
      color: #e9d5ff;
      border-color: var(--itqan-purple-bright);
    }

    .timer-wrap {
      position: relative;
      width: 50px;
      height: 50px;
    }

    .timer-svg {
      width: 50px;
      height: 50px;
      transform: rotate(-90deg);
    }

    .timer-circle-bg {
      fill: none;
      stroke: rgba(0, 0, 0, 0.08);
      stroke-width: 4;
    }
    body.dark-theme .timer-circle-bg {
      stroke: rgba(255, 255, 255, 0.1);
    }

    .timer-circle-bar {
      fill: none;
      stroke: var(--itqan-purple);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 144;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }
    body.dark-theme .timer-circle-bar {
      stroke: var(--itqan-purple-bright);
    }

    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--itqan-purple);
    }
    body.dark-theme .timer-text {
      color: #fff;
    }

    .timer-critical .timer-circle-bar {
      stroke: var(--wrong) !important;
    }

    .timer-critical .timer-text {
      color: var(--wrong) !important;
      animation: heartPulse 0.8s infinite;
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .question-screen {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      padding: 1.3rem 1.1rem;
      font-size: clamp(0.95rem, 2.2vw, 1.35rem);
      font-weight: 700;
      text-align: center;
      margin-bottom: 1rem;
      min-height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(106, 27, 154, 0.08);
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-option {
      background: var(--opt-bg);
      border: 1.2px solid var(--opt-border);
      border-radius: 12px;
      color: var(--text);
      padding: 0.85rem 1rem;
      font-size: clamp(0.85rem, 1.8vw, 1.05rem);
      font-weight: 600;
      text-align: right;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .btn-option .choice-sym {
      color: var(--itqan-purple);
      margin-left: 10px;
      font-weight: 900;
      font-size: 1.15rem;
    }
    body.dark-theme .btn-option .choice-sym {
      color: var(--itqan-purple-bright);
    }

    .btn-option:hover:not(:disabled) {
      border-color: var(--itqan-purple);
      background: var(--itqan-purple-soft);
    }

    .btn-option.selected {
      background: var(--selected) !important;
      color: #fff !important;
      border-color: #ffedd5 !important;
      box-shadow: 0 0 18px rgba(234, 88, 12, 0.85);
      animation: pulseSelection 0.5s infinite alternate;
    }

    @keyframes pulseSelection {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }

    .btn-option.correct {
      background: var(--correct) !important;
      color: #fff !important;
      border-color: #6ee7b7 !important;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.85);
      animation: flashSuccess 0.4s ease-in-out 3;
    }

    @keyframes flashSuccess {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .btn-option.wrong {
      background: var(--wrong) !important;
      color: #fff !important;
      border-color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.85);
    }

    .btn-option:disabled {
      cursor: default;
    }

    .ladder-panel {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 0.8rem;
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .ladder-step {
      display: flex;
      justify-content: space-between;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.25s;
    }

    .ladder-step.active {
      background: linear-gradient(90deg, var(--itqan-purple), var(--itqan-purple-light));
      color: #fff;
      transform: scale(1.02);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .ladder-step.milestone {
      color: var(--itqan-purple);
      font-weight: 900;
    }
    body.dark-theme .ladder-step.milestone {
      color: var(--itqan-purple-bright);
    }

    .mobile-ladder-btn {
      display: none;
      width: 100%;
      background: var(--itqan-purple-soft);
      border: 1px solid var(--itqan-purple);
      color: var(--itqan-purple);
      padding: 9px;
      border-radius: 10px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
    }
    body.dark-theme .mobile-ladder-btn {
      color: #f3e8ff;
    }

    .shake-screen {
      animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 1, 10, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 1rem;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1.5px solid var(--itqan-purple);
      border-radius: 20px;
      padding: 1.8rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 35px var(--accent-glow);
      max-height: 85vh;
      overflow-y: auto;
    }

    .poll-bar {
      margin: 10px 0;
      text-align: right;
      font-size: 0.85rem;
    }

    .bar-shell {
      background: rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 4px;
    }
    body.dark-theme .bar-shell {
      background: rgba(255, 255, 255, 0.1);
    }

    .bar-progress {
      height: 15px;
      background: linear-gradient(90deg, var(--itqan-purple), var(--itqan-purple-light));
      transition: width 1s ease;
      width: 0%;
    }

    .btn-action {
      background: var(--itqan-purple);
      color: #ffffff;
      border: none;
      padding: 10px 28px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 1.2rem;
      font-size: 0.95rem;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 120;
    }

    /* التجاوب مع شاشات الجوال */
    @media (max-width: 768px) {
      header {
        padding: 0.4rem 0.8rem;
      }
      .brand-section {
        gap: 8px;
      }
      .header-logo-card {
        padding: 2px 8px;
      }
      .header-logo-card img {
        max-height: 30px;
      }
      .player-details h3 {
        font-size: 0.85rem;
      }
      .player-details span {
        font-size: 0.68rem;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
      }
      main {
        padding: 0.6rem 0.8rem;
        flex-direction: column;
      }
      .ladder-panel {
        display: none;
      }
      .mobile-ladder-btn {
        display: block;
      }
      .options-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .question-screen {
        padding: 1rem 0.8rem;
        min-height: 85px;
        font-size: 1.05rem;
        margin-bottom: 0.8rem;
      }
      .btn-option {
        padding: 0.75rem 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="studio-stage">
    <div class="spotlight spotlight-left"></div>
    <div class="spotlight spotlight-right"></div>
  </div>

  <div id="flash-overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <!-- 1. الشاشة الافتتاحية -->
  <section id="intro-screen">
    <div class="intro-card">
      <div class="logo-badge" onclick="document.getElementById('logo-upload-input').click()" title="انقر لتغيير الشعار">
        <img id="intro-school-logo" src="شعار_اتقان_بدون_خلفية-removebg-preview.png" alt="شعار مدارس إتقان">
      </div>
      <input type="file" id="logo-upload-input" style="display:none" accept="image/*" onchange="handleLogoUpload(event)">

      <h1 class="intro-title">بنك إتقان المعرفي</h1>
      <p class="intro-motto">«معرفتك رصيدك .. وذكاؤك مفتاح الفوز»</p>

      <div class="form-group">
        <label>اسم المتسابق / الفريق:</label>
        <input type="text" id="player-name-input" class="input-box" placeholder="اكتب اسم المتسابق..." value="بطل إتقان">
      </div>

      <div class="form-group">
        <label>المرحلة الدراسية:</label>
        <select id="stage-select-input" class="select-box">
          <option value="primary_lower">الصفوف الأولية (1 - 3 ابتدائي)</option>
          <option value="primary_upper" selected>الصفوف العليا (4 - 6 ابتدائي)</option>
          <option value="intermediate">المرحلة المتوسطة</option>
          <option value="secondary">المرحلة الثانوية</option>
        </select>
      </div>

      <button class="btn-launch" onclick="launchGame()">دخول ساحة التحدي ⚡</button>
    </div>
  </section>

  <!-- 2. شاشة المسابقة التفاعلية -->
  <div id="game-screen">
    <header>
      <div class="header-row-top">
        <div class="brand-section">

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById("btn-sound").textContent = isMuted ? "🔇" : "🔊";
    }

    function toggleTheme() {
      document.body.classList.toggle("dark-theme");
      const isDark = document.body.classList.contains("dark-theme");
      document.getElementById("btn-theme").textContent = isDark ? "☀️" : "🌙";
    }

    const SoundEngine = {
      play(freqs, type = 'sine', duration = 0.5, gainLevel = 0.1, slideFreq = null) {
        if (isMuted) return;
        initAudio();
        freqs.forEach(freq => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          if (slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
          }
          gain.gain.setValueAtTime(gainLevel, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        });
      },
      click() {
        this.play([450], 'triangle', 0.08, 0.08);
      },
      tick() {
        this.play([1200], 'sine', 0.04, 0.07);
      },
      intro() {
        this.play([220, 329.63, 440], 'triangle', 1.2, 0.08);
        setTimeout(() => this.play([329.63, 440, 554.37], 'sine', 1.8, 0.1), 300);
      },
      tension() {
        this.play([75, 150], 'sawtooth', 1.3, 0.08, 90);
      },
      correct() {
        [523.25, 659.25, 783.99, 1046.50].forEach((note, i) => {
          setTimeout(() => this.play([note], 'triangle', 0.45, 0.12), i * 90);
        });
      },
      wrong() {
        this.play([160, 110], 'sawtooth', 0.7, 0.18, 50);
      },
      lifeline() {
        this.play([350], 'sine', 0.35, 0.15, 1400);
      }
    };

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById("intro-school-logo").src = e.target.result;
        document.getElementById("header-logo-img").src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function launchGame() {
      SoundEngine.intro();
      const pName = document.getElementById("player-name-input").value.trim() || "بطل إتقان";
      const sVal = document.getElementById("stage-select-input").value;

      document.getElementById("display-player-name").textContent = pName;
      document.getElementById("display-stage-name").textContent = stageTitles[sVal];

      const intro = document.getElementById("intro-screen");
      const game = document.getElementById("game-screen");

      intro.style.opacity = "0";
      intro.style.transform = "scale(0.95)";

      setTimeout(() => {
        intro.style.display = "none";
        game.style.display = "flex";
        restartRound();
      }, 400);
    }

    function returnToIntro() {
      clearInterval(timerInterval);
      const intro = document.getElementById("intro-screen");
      const game = document.getElementById("game-screen");

      game.style.display = "none";
      intro.style.display = "flex";
      setTimeout(() => {
        intro.style.opacity = "1";
        intro.style.transform = "scale(1)";
      }, 20);
      closeModal("modal-result");
    }

    function restartRound() {
      initAudio();
      usedQuestions.clear();
      currentIdx = 0;
      document.querySelectorAll(".btn-lifeline").forEach(b => b.disabled = false);
      closeModal("modal-result");
      buildLadders();
      loadNextQuestion();
    }

    function buildLadders() {
      const desktopLadder = document.getElementById("ladder");
      const mobileLadder = document.getElementById("mobile-ladder-content");
      desktopLadder.innerHTML = "";
      mobileLadder.innerHTML = "";

      points.forEach((pts, i) => {
        const item = document.createElement("div");
        item.className = `ladder-step ${i === currentIdx ? 'active' : ''} ${i === 2 || i === 6 || i === 9 ? 'milestone' : ''}`;
        item.id = `ladder-step-${i}`;
        item.innerHTML = `<span>سؤال ${i + 1}</span> <span>${pts}</span>`;

        const clone = item.cloneNode(true);
        clone.id = `mobile-step-${i}`;

        desktopLadder.appendChild(item);
        mobileLadder.appendChild(clone);
      });
    }

    function updateLadderHighlights() {
      points.forEach((_, i) => {
        const dItem = document.getElementById(`ladder-step-${i}`);
        const mItem = document.getElementById(`mobile-step-${i}`);
        if (dItem) {
          if (i === currentIdx) dItem.classList.add("active");
          else dItem.classList.remove("active");
        }
        if (mItem) {
          if (i === currentIdx) mItem.classList.add("active");
          else mItem.classList.remove("active");
        }
      });
    }

    function loadNextQuestion() {
      const stage = document.getElementById("stage-select-input").value;
      const pool = questionBank[stage] || questionBank.primary_upper;

      let available = pool.filter(q => !usedQuestions.has(q.question));
      if (available.length === 0) {
        usedQuestions.clear();
        available = pool;
      }

      currentQuestion = available[Math.floor(Math.random() * available.length)];
      usedQuestions.add(currentQuestion.question);

      document.getElementById("category-badge").textContent = `المجال: ${currentQuestion.category}`;
      document.getElementById("question").textContent = currentQuestion.question;

      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach((btn, i) => {
        btn.querySelector(".choice-text").textContent = currentQuestion.options[i];
        btn.className = "btn-option";
        btn.disabled = false;
        btn.style.visibility = "visible";
      });

      updateLadderHighlights();
      resetTimer();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerValue = 45;
      const timerEl = document.getElementById("timer");
      const timerBox = document.getElementById("timer-box");
      const progressCircle = document.getElementById("timer-progress");

      timerEl.textContent = timerValue;
      timerBox.classList.remove("timer-critical");
      progressCircle.style.strokeDashoffset = "0";

      const totalDash = 144;

      timerInterval = setInterval(() => {
        timerValue--;
        timerEl.textContent = timerValue;

        const offset = totalDash - (timerValue / 45) * totalDash;
        progressCircle.style.strokeDashoffset = offset;

        if (timerValue <= 10) {
          timerBox.classList.add("timer-critical");
          SoundEngine.tick();
        }

        if (timerValue <= 0) {
          clearInterval(timerInterval);
          triggerWrongVisuals();
          endGame(false, "انتهى الوقت المحدد للمحاولة!");
        }
      }, 1000);
    }

    function selectAnswer(choiceIdx) {
      clearInterval(timerInterval);
      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach(b => b.disabled = true);
      buttons[choiceIdx].classList.add("selected");
      SoundEngine.tension();

      setTimeout(() => {
        if (choiceIdx === currentQuestion.correct) {
          buttons[choiceIdx].classList.remove("selected");
          buttons[choiceIdx].classList.add("correct");
          triggerCorrectVisuals();

          setTimeout(() => {
            currentIdx++;
            if (currentIdx >= points.length) {
              const playerName = document.getElementById("player-name-input").value || "المتسابق";
              endGame(true, `ألف مبارك للبطل (${playerName})! نلت المليون في مسابقة إتقان المعرفية 🏆`);
            } else {
              loadNextQuestion();
            }
          }, 1500);
        } else {
          buttons[choiceIdx].classList.remove("selected");
          buttons[choiceIdx].classList.add("wrong");
          buttons[currentQuestion.correct].classList.add("correct");
          triggerWrongVisuals();
          setTimeout(() => endGame(false, "إجابة غير صحيحة. رصيدك المعرفي يزداد مع كل محاولة!"), 1800);
        }
      }, 1400);
    }

    function triggerCorrectVisuals() {
      SoundEngine.correct();
      launchConfetti(85);
      const flash = document.getElementById("flash-overlay");
      flash.className = "flash-correct";
      setTimeout(() => { flash.className = ""; }, 400);
    }

    function triggerWrongVisuals() {
      SoundEngine.wrong();
      const stage = document.getElementById("main-stage");
      const flash = document.getElementById("flash-overlay");
      stage.classList.add("shake-screen");
      flash.className = "flash-wrong";
      setTimeout(() => {
        stage.classList.remove("shake-screen");
        flash.className = "";
      }, 600);
    }

    function useFiftyFifty() {
      SoundEngine.lifeline();
      document.getElementById("btn-50").disabled = true;
      let wrong = [0, 1, 2, 3].filter(i => i !== currentQuestion.correct);
      wrong.sort(() => Math.random() - 0.5);
      const buttons = document.querySelectorAll(".btn-option");
      buttons[wrong[0]].style.visibility = "hidden";
      buttons[wrong[1]].style.visibility = "hidden";
    }

    function useExtraTime() {
      SoundEngine.lifeline();
      document.getElementById("btn-time").disabled = true;
      timerValue += 30;
      document.getElementById("timer").textContent = timerValue;
    }

    function useAudiencePoll() {
      SoundEngine.lifeline();
      document.getElementById("btn-poll").disabled = true;
      const pollBox = document.getElementById("poll-results");
      pollBox.innerHTML = "";

      let percentages = [10, 10, 10, 10];
      percentages[currentQuestion.correct] += 50;
      percentages = percentages.map(p => Math.floor(p + (Math.random() * 8)));

      currentQuestion.options.forEach((opt, idx) => {
        pollBox.innerHTML += `
          <div class="poll-bar">
            <span>${opt} (${percentages[idx]}%)</span>
            <div class="bar-shell">
              <div class="bar-progress" style="width: ${percentages[idx]}%;"></div>
            </div>
          </div>
        `;
      });

      openModal("modal-poll");
    }

    function openModal(id) {
      document.getElementById(id).style.display = "flex";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    function endGame(isWin, msg) {
      const modal = document.getElementById("modal-result");
      document.getElementById("result-title").textContent = isWin ? "🏆 فوز مستحق وإتقان باهر!" : "انتهت المسابقة";
      document.getElementById("result-desc").textContent = msg;
      modal.style.display = "flex";
      if (isWin) launchConfetti(350);
    }

    /* محرك القصاصات والاحتفال */
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    let confetti = [];
    let animatingConfetti = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti(count = 70) {
      const colors = ["#6a1b9a", "#9c27b0", "#0284c7", "#10b981", "#f5b301"];
      for (let i = 0; i < count; i++) {
        confetti.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          r: Math.random() * 5 + 3,
          dx: (Math.random() - 0.5) * 14,
          dy: (Math.random() - 0.5) * 14 - 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.random() * 10,
          tiltAngle: 0,
          tiltAngleInc: Math.random() * 0.08 + 0.04
        });
      }
      if (!animatingConfetti) updateConfetti();
    }

    function updateConfetti() {
      animatingConfetti = true;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confetti.forEach((p, index) => {
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.22;
        p.tiltAngle += p.tiltAngleInc;
        p.tilt = Math.sin(p.tiltAngle) * 12;

        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
        ctx.stroke();

        if (p.y > canvas.height) confetti.splice(index, 1);
      });

      if (confetti.length > 0) {
        requestAnimationFrame(updateConfetti);
      } else {
        animatingConfetti = false;
      }
    }
  </script>
</body>
</html>
